name: Fetch photos from Carrd
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-photos.yml', 'fetch-photos.sh']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash fetch-photos.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Add gallery photos downloaded from Carrd" && git push)
